en:
  # Core hands the browser only the camaleon_cms.admin.js tree, so a string the editor's script
  # reads has to live under it.
  camaleon_cms:
    admin:
      js:
        grid_editor:
          import_failed: "The template could not be loaded."
          request_failed: "The request was not completed. Reload the page and try again."
          content_unreadable: "This content is marked as a grid but could not be read as a grid, so it stays in the text editor."
          editor_failed: "The grid editor could not be opened, so the content stays in the text editor."
  camaleon_editor:
    permission:
      label: "Grid Editor"
      description: "Can switch the post editor to the grid editor and apply saved grid templates"
      manage_label: "Grid templates"
      manage_description: "Can create, edit and delete the shared grid templates of the site"
    templates:
      apply: "Apply template"
      apply_confirm: "Apply this template? It replaces the current content of the grid."
  admin:
    js:
      grid_editor:
        templates: "Templates"
        use_tpl: "Use Template"
        save_tpl: "Save as template"
        list: "List of templates"
        text_editor: "Text Editor"
        blocks: "Blocks"
        contents: "Content Elements"
        toggle_editor: "Are you sure to leave this editor?"
        del_block: "Are you sure to delete this block?"
        del_content: "Are you sure to delete this content?"
        clear_editor: "Are you sure to clear the editor?"

