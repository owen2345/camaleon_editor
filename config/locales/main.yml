it:
  # Core hands the browser only the camaleon_cms.admin.js tree, so a string the editor's script
  # reads has to live under it.
  camaleon_cms:
    admin:
      js:
        grid_editor:
          templates: "Modelli"
          save_tpl: "Salva come modello"
          list: "Elenco dei modelli"
          text_editor: "Editor di testo"
          blocks: "Blocchi"
          contents: "Contenuto"
          clear: "Svuota"
          preview: "Anteprima"
          fullscreen: "Schermo intero"
          toggle_editor: "Sei sicuro di voler lasciare questo editor?"
          del_block: "Sei sicuro di voler eliminare questo blocco?"
          del_content: "Sei sicuro di voler cancellare questo contenuto?"
          clear_editor: "Sei sicuro di voler svuotare l'editor?"
          save_tpl_title: "Nuovo modello"
          list_title: "Modelli di griglia"
          style_settings_title: "Impostazioni di stile"
          col_block_title: "Inserisce un blocco colonna largo il %{width}%."
          break_line_title: "Inserisce un'interruzione di riga per ordinare i blocchi colonna."
          blocks_hint: "Trascina e rilascia questi blocchi (blocchi colonna) nell'area sottostante."
          contents_hint: "Trascina e rilascia questi blocchi (blocchi di contenuto) in qualsiasi blocco colonna."
          import_failed: "Impossibile caricare il modello."
          request_failed: "La richiesta non è stata completata. Ricarica la pagina e riprova."
          content_unreadable: "Questo contenuto è contrassegnato come griglia ma non è leggibile come tale, quindi resta nell'editor di testo."
          editor_failed: "Impossibile aprire l'editor a griglia, quindi il contenuto resta nell'editor di testo."
  camaleon_editor:
    permission:
      label: "Grid Editor"
      description: "Può passare l'editor dei contenuti all'editor a griglia e applicare i modelli salvati"
      manage_label: "Grid templates"
      manage_description: "Può creare, modificare ed eliminare i modelli a griglia condivisi del sito"
    templates:
      apply: "Applica modello"
      apply_confirm: "Applicare questo modello? Sostituisce il contenuto attuale della griglia."
